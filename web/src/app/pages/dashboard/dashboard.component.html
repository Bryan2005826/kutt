<div class="shell">
  <button class="menu-toggle" (click)="toggleMenu()" aria-label="Abrir menú">☰</button>
  <div class="sidebar-backdrop" *ngIf="menuAbierto()" (click)="toggleMenu()"></div>

  <aside class="sidebar" [class.abierto]="menuAbierto()">
    <div class="brand">
      <span class="brand-crown">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8z" fill="#e8352e"/><circle cx="12" cy="19" r="1.4" fill="#e8352e"/></svg>
      </span>
      <span class="brand-name">Kutt</span>
      <button class="cerrar-menu" (click)="toggleMenu()" aria-label="Cerrar menú">✕</button>
    </div>

    <nav class="side-nav">
      <a *ngFor="let item of navItems" class="side-link" [routerLink]="item.path"
         routerLinkActive="active" [routerLinkActiveOptions]="{exact: item.path === '/dashboard'}">
        <span class="side-dot"></span>
        {{ item.label }}
      </a>
    </nav>

    <a routerLink="/" class="side-back">← Volver al sitio</a>
    <div class="side-user" *ngIf="auth.usuario()">
      <span>{{ auth.usuario()?.nombre }}</span>
      <button (click)="auth.logout()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="content">
    <div class="offline-banner" *ngIf="data.sinConexion()">
      No se pudo conectar con el backend en localhost:8080. Verifica que el proyecto Spring Boot esté corriendo (mvn spring-boot:run) y que MySQL esté encendido.
    </div>
    <router-outlet></router-outlet>
  </main>
</div>
