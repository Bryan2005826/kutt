app.recaptcha.secret=${RECAPTCHA_SECRET:6LeradAtAAAAAOTPy082hMUsXT9I-Qf_KCripxQt}

# Clave secreta para usar una sola vez el endpoint POST /api/admin/cargar-negocios,
# que elimina los negocios de demostracion y carga negocios reales (lo llama el script
# cargar-negocios.ps1). Vacia por defecto, lo que deja el endpoint deshabilitado; para
# usarlo, agrega la variable de entorno SEED_KEY en Render con cualquier valor dificil de
# adivinar, ejecuta el script una vez, y luego borra la variable para deshabilitarlo.
app.admin.seed-key=${SEED_KEY:}
