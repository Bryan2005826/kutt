spring.application.name=kutt-backend
server.port=${PORT:8080}

# Base de datos: local por defecto (MySQL via XAMPP). En un servidor real, estas
# tres se sobreescriben con variables de entorno (DB_URL, DB_USER, DB_PASSWORD),
# sin tener que tocar este archivo.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kutt_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=20000

# Crea/actualiza las tablas automaticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Clave para firmar los JWT. Trae un valor por defecto para desarrollo local;
# en un servidor real se sobreescribe con la variable de entorno JWT_SECRET.
app.jwt.secret=${JWT_SECRET:emilker-barber-shop-clave-secreta-super-larga-para-firmar-jwt-local}

# Origenes permitidos por CORS, separados por coma. Por defecto solo el frontend
# local; en un servidor real se sobreescribe con la variable de entorno CORS_ORIGINS.
app.cors.origins=${CORS_ORIGINS:http://localhost:4200,https://kutt-8ba8f.web.app,https://kutt-8ba8f.firebaseapp.com}

# Carpeta donde se guardan las fotos que sube el administrador (productos,
# personal, etc.). Se crea sola la primera vez que alguien sube algo.
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Ruta del archivo .json que descargaste de Firebase (Configuracion del
# proyecto -> Cuentas de servicio -> Generar nueva clave privada). Pon ese
# archivo en la raiz de kutt-backend con este nombre exacto, o cambia la ruta
# aqui / con la variable de entorno FIREBASE_CREDENTIALS.
app.firebase.credentials-path=${FIREBASE_CREDENTIALS:firebase-service-account.json}

# ---- Correo saliente: recordatorios de citas (CU-09) ----
