spring.application.name=kutt-backend
server.port=8080

# Base de datos local (MySQL debe estar corriendo, por ejemplo via XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/kutt_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Crea/actualiza las tablas automaticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

